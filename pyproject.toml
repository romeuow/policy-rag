[project]
name = "policy-rag"
version = "0.1.0"
description = "Full-stack RAG assistant for internal policy documents with hybrid search, citations and SSE streaming."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Romeu Oliveira" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[project.scripts]
policy-rag = "policy_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pypdf>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/policy_rag"]
omit = ["src/policy_rag/store/pgvector.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
