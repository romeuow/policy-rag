services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
      POSTGRES_DB: policy_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://policy:policy@postgres:5432/policy_rag
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override APP_MODE=prod in .env (plus ANTHROPIC_API_KEY / VOYAGE_API_KEY) to use real services.
      APP_MODE: ${APP_MODE:-demo}
      DATABASE_URL: postgresql://policy:policy@postgres:5432/policy_rag
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
